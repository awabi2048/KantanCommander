execution:
  max-nodes-per-activation: 1024
  max-disk-call-depth: 3
  max-summoned-entities-per-world: 256
  max-summoned-entities-server: 2048
  # 直近1秒にワールド全体へ送信できるParticle個数です。実行個数そのものを加算します。
  max-particles-per-world-per-second: 600
limits:
  max-nodes-per-disk: 512
  max-map-width: 1024
  max-map-height: 256
  max-branch-depth: 32
timer:
  maximum-seconds: 86400
# 制御ブロック注視表示です。有効化すると、制御ブロックを見ている
# プレイヤーへ program 名・所有者を短時間だけ表示します。
gaze:
  enabled: false
  distance: 8.0
  interval-ticks: 10
config_version: 8
