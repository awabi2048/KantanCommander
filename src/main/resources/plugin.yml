name: KantanCommander
version: ${project.version}
main: me.awabi2048.kantancommander.KantanCommanderPlugin
api-version: '26.1.2'
author: awabi2048
depend:
  - CC-System
  - MyWorldManager
softdepend:
  - MWMChanpon
  - Geyser-Spigot
  - EasyArmorStands
  - AxiomPaper
commands:
  kankoma:
    description: Kantan Commander 管理コマンド
    usage: /kankoma <library|history|placed|reload|help>
    permission: kankoma.use
permissions:
  kankoma.admin:
    description: Kantan Commander の管理操作を許可する
    default: op
  kankoma.use:
    description: Kantan Commander の利用を許可する
    default: true
  kankoma.extended_command_block:
    description: 拡張コマンドブロックの手動操作を許可する（MWM-Chanponがワールド単位で付与）
    default: false
