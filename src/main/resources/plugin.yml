name: KantanCommander
version: ${project.version}
main: me.awabi2048.kantancommander.KantanCommanderPlugin
api-version: '26.1.2'
author: awabi2048
depend:
  - CC-System
  - MyWorldManager
softdepend:
  - MWMChanpon
  - Geyser-Spigot
  - EasyArmorStands
  - AxiomPaper
commands:
  kankoma:
    description: Kantan Commander 管理コマンド
    usage: /kankoma [history|library|placed|reload|help]
permissions:
  kankoma.admin:
    description: Kantan Commander の管理操作を許可する
    default: op
    children:
      kankoma.command.kankoma: true
      kankoma.command.history: true
      kankoma.command.library: true
      kankoma.command.help: true
      kankoma.command.placed: true
      kankoma.command.reload: true
  kankoma.command.kankoma:
    description: /kankoma によるかんたんコマンダー制御ブロックの付与を許可する
    default: false
  kankoma.command.history:
    description: /kankoma history の実行を許可する
    default: false
  kankoma.command.library:
    description: /kankoma library の実行を許可する
    default: false
  kankoma.command.help:
    description: /kankoma help の実行を許可する
    default: true
  kankoma.command.placed:
    description: /kankoma placed の実行を許可する
    default: false
  kankoma.command.reload:
    description: /kankoma reload の実行を許可する
    default: false
  kankoma.extended_command_block:
    description: かんたんコマンダー制御ブロックの手動操作を許可する（MWM-Chanponがワールド単位で付与）
    default: false
